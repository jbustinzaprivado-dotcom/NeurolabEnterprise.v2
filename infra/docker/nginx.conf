server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 510m;  # el límite real de carga lo aplica la API (M10)

    # API REST.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    # Canal SSE (§9): sin buffer ni tiempo de espera corto, para que cada época llegue al instante.
    location ~ ^/api/v1/training-jobs/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Las métricas son internas: no se exponen a través del frontend.
    location = /metrics { return 404; }

    # Aplicación de una sola página: cualquier otra ruta sirve index.html.
    location / {
        try_files $uri /index.html;
    }
}
