# Despliegue completo con Docker (§5 Operación, §14 fase 6).
#
#   docker compose -f infra/docker/docker-compose.yml --env-file infra/docker/.env up --build
#
# Copia infra/docker/.env.example como infra/docker/.env y rellena las claves.
# Web: http://localhost:8080 · Prometheus: http://localhost:9090

name: neurolab

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neurolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en infra/docker/.env}
      POSTGRES_DB: neurolab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurolab -d neurolab"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Almacenamiento de objetos S3 (§5) para datasets y artefactos de modelos.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: neurolab
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Define MINIO_PASSWORD en infra/docker/.env}
    volumes:
      - objetos:/data
    ports: ["9001:9001"]  # consola web de MinIO
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: { context: ../.., dockerfile: infra/docker/python.Dockerfile }
    environment: &backend-env
      NEUROLAB_ENV: ${NEUROLAB_ENV:-production}
      NEUROLAB_DATABASE_URL: postgresql+psycopg2://neurolab:${POSTGRES_PASSWORD}@db:5432/neurolab
      NEUROLAB_SECRET_KEY: ${NEUROLAB_SECRET_KEY:?Define NEUROLAB_SECRET_KEY en infra/docker/.env}
      NEUROLAB_AUTH_DEV_BYPASS: "false"
      NEUROLAB_SEED_DEMO: ${NEUROLAB_SEED_DEMO:-true}
      NEUROLAB_SEED_HISTORY: "false"
      NEUROLAB_CORS_ORIGINS: http://localhost:8080
      NEUROLAB_METRICS_REMOTE: "true"
      NEUROLAB_STORAGE_BACKEND: s3
      NEUROLAB_S3_ENDPOINT: http://minio:9000
      NEUROLAB_S3_BUCKET: neurolab
      NEUROLAB_S3_ACCESS_KEY: neurolab
      NEUROLAB_S3_SECRET_KEY: ${MINIO_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
    expose: ["8000"]

  worker:
    build: { context: ../.., dockerfile: infra/docker/python.Dockerfile }
    command: ["python", "workers/training/main.py"]
    environment: *backend-env
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      disable: true

  web:
    build: { context: ../.., dockerfile: infra/docker/web.Dockerfile }
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

volumes:
  pgdata:
  objetos:
