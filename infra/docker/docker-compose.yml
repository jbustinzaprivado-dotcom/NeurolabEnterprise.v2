# Despliegue completo con Docker (§5 Operación, §14 fase 6).
#
#   docker compose -f infra/docker/docker-compose.yml --env-file infra/docker/.env up --build
#
# Copia infra/docker/.env.example como infra/docker/.env y rellena las claves.
# Web: http://localhost:8080 · Keycloak: http://localhost:8180 · Prometheus: http://localhost:9090

name: neurolab

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neurolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en infra/docker/.env}
      POSTGRES_DB: neurolab
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Define KEYCLOAK_DB_PASSWORD en infra/docker/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./keycloak-db.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurolab -d neurolab"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Almacenamiento de objetos S3 (§5) para datasets y artefactos de modelos: SeaweedFS.
  # (MinIO dejó de publicar imágenes comunitarias en Docker Hub.) La identidad S3 se genera
  # al arrancar con la clave de S3_PASSWORD; sin ella el servicio no acepta peticiones.
  objetos:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_PASSWORD: ${S3_PASSWORD:?Define S3_PASSWORD en infra/docker/.env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"neurolab","credentials":[{"accessKey":"neurolab","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_PASSWORD" > /tmp/s3.json
        && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - objetos:/data

  # Proveedor de identidad (§11): Keycloak con el reino de NeuroLab. La interfaz inicia sesión
  # en http://localhost:8180 (Authorization Code + PKCE) y la API valida sus tokens.
  # Sin HTTPS todavía (fase 6): solo para uso en la propia máquina.
  identidad:
    image: keycloak/keycloak:26.8.1
    command: ["start", "--import-realm", "--http-enabled=true", "--http-port=8180",
              "--hostname=http://localhost:8180", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD en infra/docker/.env}
    volumes:
      - ../keycloak/neurolab-realm.json:/opt/keycloak/data/import/neurolab-realm.json:ro
    ports: ["8180:8180"]
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ../.., dockerfile: infra/docker/python.Dockerfile }
    environment: &backend-env
      NEUROLAB_ENV: ${NEUROLAB_ENV:-production}
      NEUROLAB_DATABASE_URL: postgresql+psycopg2://neurolab:${POSTGRES_PASSWORD}@db:5432/neurolab
      NEUROLAB_SECRET_KEY: ${NEUROLAB_SECRET_KEY:?Define NEUROLAB_SECRET_KEY en infra/docker/.env}
      NEUROLAB_AUTH_DEV_BYPASS: "false"
      NEUROLAB_AUTH_PROVIDER: oidc
      NEUROLAB_OIDC_ISSUER: http://localhost:8180/realms/neurolab
      # Dentro de la red de Docker la API alcanza a Keycloak por su nombre de servicio.
      NEUROLAB_OIDC_INTERNAL_URL: http://identidad:8180/realms/neurolab
      NEUROLAB_SEED_DEMO: ${NEUROLAB_SEED_DEMO:-true}
      NEUROLAB_SEED_HISTORY: "false"
      NEUROLAB_CORS_ORIGINS: http://localhost:8080
      NEUROLAB_METRICS_REMOTE: "true"
      NEUROLAB_STORAGE_BACKEND: s3
      NEUROLAB_S3_ENDPOINT: http://objetos:8333
      NEUROLAB_S3_BUCKET: neurolab
      NEUROLAB_S3_ACCESS_KEY: neurolab
      NEUROLAB_S3_SECRET_KEY: ${S3_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
      objetos: { condition: service_started }
      identidad: { condition: service_started }
    # El almacén de objetos puede tardar unos segundos en aceptar peticiones al arrancar.
    restart: on-failure
    expose: ["8000"]

  worker:
    build: { context: ../.., dockerfile: infra/docker/python.Dockerfile }
    command: ["python", "workers/training/main.py"]
    environment: *backend-env
    restart: on-failure
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      disable: true

  web:
    build: { context: ../.., dockerfile: infra/docker/web.Dockerfile }
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

volumes:
  pgdata:
  objetos:
