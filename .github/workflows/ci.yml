# Integración continua (§14 fase 1, §15): pruebas contra PostgreSQL real y build del frontend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: API, worker y migraciones (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neurolab
          POSTGRES_PASSWORD: neurolab
          POSTGRES_DB: neurolab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neurolab -d neurolab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEUROLAB_TEST_DATABASE_URL: postgresql+psycopg2://neurolab:neurolab@localhost:5432/neurolab_test
      # Toda la suite corre contra un almacén de objetos S3 real (SeaweedFS), como en el despliegue.
      NEUROLAB_STORAGE_BACKEND: s3
      NEUROLAB_S3_ENDPOINT: http://localhost:8333
      NEUROLAB_S3_BUCKET: neurolab-ci
      NEUROLAB_S3_ACCESS_KEY: neurolab
      NEUROLAB_S3_SECRET_KEY: neurolab-ci-clave
      NEUROLAB_LOG_FORMAT: text
      TF_CPP_MIN_LOG_LEVEL: "2"
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Iniciar almacén de objetos S3 (SeaweedFS)
        working-directory: .
        run: |
          echo '{"identities":[{"name":"neurolab","credentials":[{"accessKey":"neurolab","secretKey":"neurolab-ci-clave"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3.json"
          docker run -d --name objetos -p 8333:8333 -v "$RUNNER_TEMP/s3.json:/etc/s3.json:ro"             chrislusf/seaweedfs:4.48 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8333/ || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          sleep 5
          docker logs objetos | tail -5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas unitarias e integración (§15)
        run: python -m pytest -q
      - name: Migraciones al día con el modelo
        env:
          NEUROLAB_DATABASE_URL: postgresql+psycopg2://neurolab:neurolab@localhost:5432/neurolab_test
        run: |
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    name: Frontend (typecheck y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
