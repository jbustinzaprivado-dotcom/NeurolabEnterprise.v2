# Migraciones de base de datos (§14 fase 1, §17). Los scripts viven en infra/migrations (§13).
# La URL no se escribe aquí: env.py la toma de NEUROLAB_DATABASE_URL (archivo .env).
#
#   cd services\api
#   ..\..\venv\Scripts\python.exe -m alembic upgrade head
#   ..\..\venv\Scripts\python.exe -m alembic revision --autogenerate -m "descripcion"

[alembic]
script_location = %(here)s/../../infra/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
